# Сайт aledev.ru для системного nginx сервера (managed by aledev-deploy).
# SSL-блоки дописывает certbot, без update_nginx файл не перезаписывается.

upstream aledev_frontend {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name aledev.ru www.aledev.ru auth.aledev.ru portfolio.aledev.ru;

    client_max_body_size 200M;

    location / {
        proxy_pass http://aledev_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
