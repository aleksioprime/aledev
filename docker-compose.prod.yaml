x-app: &app
  env_file:
    - .env
  restart: unless-stopped
  platform: linux/amd64

services:
  frontend:
    image: aleksioprime/aledev-frontend:latest
    container_name: aledev-frontend
    <<: *app
    volumes:
      - ./media:/usr/share/nginx/html/media
    # Наружу смотрит системный nginx сервера (SSL, другие сайты) и проксирует сюда
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    networks:
      - shared

networks:
  shared:
    external: true
    name: aledev-shared
