limit_req_zone $binary_remote_addr zone=per_ip_rate:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m;

resolver 127.0.0.11 ipv6=off valid=30s;

# Запросы приходят от системного nginx сервера через Docker-сеть:
# реальный IP клиента и схему (https) берём из его заголовков
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# цепочку прокси уже собрал системный nginx — не дописываем клиента второй раз
map $http_x_forwarded_for $forwarded_for {
    default $http_x_forwarded_for;
    ""      $remote_addr;
}

proxy_headers_hash_max_size 1024;
proxy_headers_hash_bucket_size 128;

server {
    listen 80;
    server_name aledev.ru www.aledev.ru localhost;

    client_max_body_size 200M;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 30s;

    include /etc/nginx/snippets/server-rate-limit.conf;
    include /etc/nginx/snippets/server-security.conf;
    include /etc/nginx/snippets/spa-common.conf;
}

server {
    listen 80;
    server_name auth.aledev.ru www.auth.aledev.ru;

    include /etc/nginx/snippets/server-rate-limit.conf;
    include /etc/nginx/snippets/server-security.conf;

    location / {
        set $auth_upstream http://aledev-auth-app:8000;
        proxy_pass $auth_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}

server {
    listen 80;
    server_name portfolio.aledev.ru www.portfolio.aledev.ru;

    include /etc/nginx/snippets/server-rate-limit.conf;
    include /etc/nginx/snippets/server-security.conf;

    location / {
        set $portfolio_upstream http://aledev-portfolio-app:8000;
        proxy_pass $portfolio_upstream;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}
