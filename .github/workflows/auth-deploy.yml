name: Deploy Auth Service

run-name: "Deploy Auth Service for ${{ github.ref_name }} by ${{ github.actor }}"

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: deploy-auth
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: ./.github/actions/ssh-setup
        with:
          host: ${{ secrets.SERVER_HOST }}
          user: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}

      - name: Upload compose file and .env
        env:
          ENV_FILE: ${{ secrets.ENV_AUTH_VARS }}
        run: |
          ssh server 'mkdir -p ~/aledev/services/auth ~/aledev/media'
          scp services/auth/docker-compose.prod.yaml server:aledev/services/auth/docker-compose.prod.yaml
          printf '%s\n' "$ENV_FILE" | ssh server 'umask 077 && cat > ~/aledev/services/auth/.env'
          echo "Файлы загружены на сервер"

      - name: Docker Hub login
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
        run: |
          printf '%s' "$DOCKER_HUB_ACCESS_TOKEN" | ssh server "docker login --username '$DOCKER_HUB_USERNAME' --password-stdin"

      - name: Deploy on server
        run: |
          ssh server bash -s <<'SCRIPT'
          set -e
          cd ~/aledev/services/auth
          docker network inspect aledev-shared >/dev/null 2>&1 || docker network create aledev-shared
          docker compose -f docker-compose.prod.yaml pull
          docker compose -f docker-compose.prod.yaml up -d --remove-orphans
          docker compose -f docker-compose.prod.yaml ps
          docker image prune -f
          echo "Auth Service обновлён!"
          SCRIPT
