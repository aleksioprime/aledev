name: Deploy Main App

run-name: "Deploy Main App for ${{ github.ref_name }} by ${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      update_nginx:
        description: "Перезаписать сайт aledev.ru в системном nginx версией из репозитория (SSL certbot пропишет заново)"
        type: boolean
        default: false
      certbot_email:
        description: "Email для Let's Encrypt (нужен только при первом выпуске на сервере без учётки certbot)"
        type: string
        default: ""
      domains:
        description: "Домены для SSL через пробел"
        type: string
        default: "aledev.ru www.aledev.ru auth.aledev.ru portfolio.aledev.ru"
  workflow_call:
    inputs:
      update_nginx:
        type: boolean
        default: false
      certbot_email:
        type: string
        default: ""
      domains:
        type: string
        default: "aledev.ru www.aledev.ru auth.aledev.ru portfolio.aledev.ru"

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: ./.github/actions/ssh-setup
        with:
          host: ${{ secrets.SERVER_HOST }}
          user: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}

      - name: Upload compose file, host nginx site and .env
        env:
          ENV_FILE: ${{ secrets.ENV_VARS }}
        run: |
          ssh server 'mkdir -p ~/aledev/media ~/aledev/deploy'
          scp docker-compose.prod.yaml server:aledev/docker-compose.prod.yaml
          scp deploy/nginx/aledev.conf server:aledev/deploy/nginx-aledev.conf
          printf '%s\n' "$ENV_FILE" | ssh server 'umask 077 && cat > ~/aledev/.env'

      - name: Docker Hub login
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
        run: |
          printf '%s' "$DOCKER_HUB_ACCESS_TOKEN" | ssh server "docker login --username '$DOCKER_HUB_USERNAME' --password-stdin"

      - name: Deploy on server
        run: |
          ssh server bash -s <<'SCRIPT'
          set -e
          cd ~/aledev
          docker network inspect aledev-shared >/dev/null 2>&1 || docker network create aledev-shared
          docker compose -f docker-compose.prod.yaml pull
          docker compose -f docker-compose.prod.yaml up -d --remove-orphans
          docker compose -f docker-compose.prod.yaml ps
          docker image prune -f
          echo "Контейнер фронтенда обновлён"
          SCRIPT

      # Порты 80/443 держит системный nginx сервера (там же другие сайты),
      # он проксирует aledev.ru и поддомены в контейнер и отвечает за SSL
      - name: Configure host nginx and SSL
        env:
          UPDATE_NGINX: ${{ inputs.update_nginx && '1' || '0' }}
          EMAIL: ${{ inputs.certbot_email }}
          DOMAINS: ${{ inputs.domains }}
        run: |
          ssh server UPDATE_NGINX="$UPDATE_NGINX" EMAIL="'$EMAIL'" DOMAINS="'$DOMAINS'" bash -s <<'SCRIPT'
          set -e
          SUDO=""; [ "$(id -u)" = 0 ] || SUDO="sudo -n"
          SITE=/etc/nginx/sites-available/aledev.ru
          PORT=$(grep -E '^FRONTEND_PORT=' ~/aledev/.env | cut -d= -f2 | tr -d '[:space:]"')
          PORT=${PORT:-8080}

          # Устанавливаем свой конфиг, если на сервере ещё старый (не наш) или просят перезаписать
          if [ "$UPDATE_NGINX" = "1" ] || ! $SUDO grep -q 'managed by aledev-deploy' "$SITE" 2>/dev/null; then
            if $SUDO test -f "$SITE"; then
              mkdir -p ~/aledev/deploy/backup
              $SUDO cp "$SITE" ~/aledev/deploy/backup/aledev.ru.$(date +%Y%m%d%H%M%S)
              echo "Старый конфиг сохранён в ~/aledev/deploy/backup/"
            fi
            sed "s/127.0.0.1:8080/127.0.0.1:$PORT/" ~/aledev/deploy/nginx-aledev.conf | $SUDO tee "$SITE" > /dev/null
            $SUDO ln -sf "$SITE" /etc/nginx/sites-enabled/aledev.ru
            echo "Конфиг сайта установлен"
          else
            echo "Конфиг сайта уже наш — не перезаписываем"
          fi
          $SUDO nginx -t
          $SUDO systemctl reload nginx

          # Выпускает сертификат или расширяет существующий на новые домены и прописывает
          # SSL в конфиг; действующий сертификат не перевыпускается. Продление — certbot.timer
          ARGS=""
          for d in $DOMAINS; do ARGS="$ARGS -d $d"; done
          if [ -n "$EMAIL" ]; then ACCOUNT="--email $EMAIL"; else ACCOUNT="--register-unsafely-without-email"; fi
          $SUDO certbot --nginx --non-interactive --agree-tos $ACCOUNT \
            --redirect --keep-until-expiring --expand $ARGS

          # старое автообновление из контейнера больше не нужно
          ( crontab -l 2>/dev/null | grep -v 'aledev-certbot' ) | crontab - || true

          curl -fsS -o /dev/null -H 'Host: aledev.ru' "http://127.0.0.1:$PORT/" && echo "Фронтенд отвечает"
          echo "Готово!"
          SCRIPT
