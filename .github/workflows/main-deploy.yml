name: Deploy Main App

run-name: "Deploy Main App for ${{ github.ref_name }} by ${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      update_nginx:
        description: "Перезаписать nginx.conf на сервере версией из репозитория (SSL-блоки certbot придётся восстановить)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      update_nginx:
        type: boolean
        default: false

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: ./.github/actions/ssh-setup
        with:
          host: ${{ secrets.SERVER_HOST }}
          user: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}

      - name: Upload compose file, nginx.conf and .env
        env:
          ENV_FILE: ${{ secrets.ENV_VARS }}
          UPDATE_NGINX: ${{ inputs.update_nginx && '1' || '0' }}
        run: |
          ssh server 'mkdir -p ~/aledev/nginx ~/aledev/media'
          scp docker-compose.prod.yaml server:aledev/docker-compose.prod.yaml
          printf '%s\n' "$ENV_FILE" | ssh server 'umask 077 && cat > ~/aledev/.env'

          # nginx.conf на сервере правит certbot (добавляет SSL), поэтому по умолчанию
          # загружаем его только при первом деплое
          if [ "$UPDATE_NGINX" = "1" ] || ! ssh server 'test -f ~/aledev/nginx/nginx.conf'; then
            ssh server 'test -f ~/aledev/nginx/nginx.conf && cp ~/aledev/nginx/nginx.conf ~/aledev/nginx/nginx.conf.bak-$(date +%Y%m%d%H%M%S) || true'
            scp frontend/nginx/nginx.conf server:aledev/nginx/nginx.conf
            echo "nginx.conf загружен"
          else
            echo "nginx.conf уже есть на сервере — не перезаписываем"
          fi

      - name: Docker Hub login
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
        run: |
          printf '%s' "$DOCKER_HUB_ACCESS_TOKEN" | ssh server "docker login --username '$DOCKER_HUB_USERNAME' --password-stdin"

      - name: Deploy on server
        run: |
          ssh server bash -s <<'SCRIPT'
          set -e
          cd ~/aledev
          docker network inspect aledev-shared >/dev/null 2>&1 || docker network create aledev-shared
          docker compose -f docker-compose.prod.yaml pull
          docker compose -f docker-compose.prod.yaml up -d --remove-orphans
          # подхватываем изменения nginx.conf, если контейнер не пересоздавался
          docker exec aledev-frontend nginx -t && docker exec aledev-frontend nginx -s reload
          docker compose -f docker-compose.prod.yaml ps
          docker image prune -f
          echo "Фронтенд обновлён!"
          SCRIPT
