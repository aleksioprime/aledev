name: Deploy All

run-name: "Deploy all services for ${{ github.ref_name }} by ${{ github.actor }}"

# Полный деплой одной кнопкой: сборка образов → auth → portfolio → фронтенд
# (вместе с сайтом в системном nginx и SSL-сертификатами).
on:
  workflow_dispatch:
    inputs:
      build:
        description: "Собрать и загрузить образы в Docker Hub перед деплоем"
        type: boolean
        default: true
      update_nginx:
        description: "Перезаписать сайт aledev.ru в системном nginx версией из репозитория"
        type: boolean
        default: false
      certbot_email:
        description: "Email для Let's Encrypt (нужен только при первом выпуске на сервере без учётки certbot)"
        type: string
        default: ""
      domains:
        description: "Домены для SSL через пробел"
        type: string
        default: "aledev.ru www.aledev.ru auth.aledev.ru portfolio.aledev.ru"

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-auth:
    if: ${{ inputs.build }}
    uses: ./.github/workflows/auth-build.yml
    secrets: inherit

  build-portfolio:
    if: ${{ inputs.build }}
    uses: ./.github/workflows/portfolio-build.yml
    secrets: inherit

  build-main:
    if: ${{ inputs.build }}
    uses: ./.github/workflows/main-build.yml
    secrets: inherit

  deploy-auth:
    needs: [build-auth, build-portfolio, build-main]
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/auth-deploy.yml
    secrets: inherit

  deploy-portfolio:
    needs: deploy-auth
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/portfolio-deploy.yml
    secrets: inherit

  deploy-main:
    needs: deploy-portfolio
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/main-deploy.yml
    with:
      update_nginx: ${{ inputs.update_nginx }}
      certbot_email: ${{ inputs.certbot_email }}
      domains: ${{ inputs.domains }}
    secrets: inherit

