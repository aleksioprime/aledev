x-app: &app
  env_file:
    - ./.env
  restart: unless-stopped
  platform: linux/amd64

services:
  portfolio-postgres:
    image: postgres:14
    container_name: aledev-portfolio-postgres
    <<: *app
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "sh -c 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}'",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - portfolio_postgres_volume:/var/lib/postgresql/data/
    networks:
      portfolio-internal:
        aliases:
          - postgres
    environment:
      TZ: "Europe/Moscow"
      PGTZ: "Europe/Moscow"

  portfolio-app:
    build:
      context: ./app
    container_name: aledev-portfolio-app
    <<: *app
    command: python src/main.py
    environment:
      UVICORN_RELOAD: "1"
    volumes:
      - ./app:/usr/src/app/
    networks:
      - portfolio-internal
    ports:
      - "8502:8000"
    depends_on:
      portfolio-postgres:
        condition: service_healthy


volumes:
  portfolio_postgres_volume:

networks:
  portfolio-internal:
